<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>编辑好物 · 星泽后台</title>
<link rel="stylesheet" href="../css/admin.css"/>
</head>
<body data-page="find-edit">
<div class="shell">
  <header class="topbar">
    <a class="back" href="./">← 好物</a>
    <div class="spacer"></div>
    <span class="mono muted" id="top-id"></span>
  </header>
  <main class="main wide edit-pad">
    <div id="scf-notice" class="banner-err" hidden>SCF 未配置 — 表单可预览；保存需 Function URL。</div>
    <h1 class="h1" id="page-title">编辑好物分享</h1>
    <p class="lead" id="lead">加载中…</p>
    <div id="errBanner" class="banner-err" hidden></div>
    <div class="edit-grid" id="form" hidden>
      <aside class="edit-side">
        <p class="section-title">图片 images[]</p>
        <div class="card">
          <div class="multi-imgs" id="multi"></div>
          <button type="button" class="btn sm ghost block" id="addImg" style="margin-top:10px">＋ 添加图片位</button>
          <p class="tiny" style="margin-top:8px">每项：src + alt · <span class="mono">/images/finds/</span></p>
        </div>
      </aside>
      <section>
        <p class="section-title">内容</p>
        <div class="card">
          <div class="row-2">
            <div class="field">
              <label for="fid" id="id-label">编号 id（只读）</label>
              <input class="input mono" id="fid" readonly/>
            </div>
            <div class="field">
              <label for="fcat">分类 category</label>
              <select class="select" id="fcat">
                <option value="crystal">#晶石鉴赏 (crystal)</option>
                <option value="wenwan">#文玩盘养 (wenwan)</option>
                <option value="hk">#港澳采买 (hk)</option>
                <option value="tea">#香道茶事 (tea)</option>
                <option value="mood">#结缘心境 (mood)</option>
              </select>
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="time">时间展示 time</label>
              <input class="input" id="time"/>
              <p class="hint">前台相对时间文案；非严格时间戳（MVP）</p>
            </div>
            <div class="field">
              <label for="loc">地点 location</label>
              <input class="input" id="loc"/>
            </div>
          </div>
          <div class="field">
            <label for="text">正文 text</label>
            <textarea class="textarea" id="text" style="min-height:140px"></textarea>
          </div>
          <div class="field" style="margin-bottom:0">
            <label>标签 tags</label>
            <div class="tag-input" id="tags"><input type="text" placeholder="添加 #标签" aria-label="添加标签"/></div>
          </div>
        </div>
        <div class="sticky-actions">
          <a class="btn ghost" href="./">取消</a>
          <button type="button" class="btn" id="saveBtn">保存</button>
        </div>
      </section>
    </div>
  </main>
</div>
<div class="toast ok" id="toastOk" role="status">已保存</div>
<div class="toast err" id="toastErr" role="alert">保存失败</div>
<script src="../config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/find-edit.js"></script>
</body>
</html>
