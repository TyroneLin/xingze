<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>编辑产品 · 星泽后台</title>
<link rel="stylesheet" href="../css/admin.css"/>
</head>
<body data-page="product-edit">
<div class="shell">
  <header class="topbar">
    <a class="back" href="./">← 产品</a>
    <div class="spacer"></div>
    <span class="mono muted" id="top-id"></span>
  </header>
  <main class="main wide edit-pad">
    <div id="scf-notice" class="banner-err" hidden>
      SCF 未配置 — 表单可预览；保存需 Function URL。
    </div>
    <h1 class="h1">编辑产品</h1>
    <p class="lead" id="lead">加载中…</p>
    <div id="errBanner" class="banner-err" hidden></div>

    <div class="edit-grid" id="form" hidden>
      <aside class="edit-side">
        <p class="section-title">主图</p>
        <div class="card">
          <div class="upload" id="uploadBox">
            <span class="ph-t">待 Leanne 素材</span>
            <span class="ph-s">image 为 null 时前台显示占位</span>
            <div class="file-row">
              <label class="btn sm" for="file">选择图片</label>
              <input id="file" type="file" accept="image/*" hidden/>
              <button type="button" class="btn sm ghost" id="clearImg">清除</button>
            </div>
            <div class="progress" id="prog" hidden><span></span></div>
            <p class="tiny" id="progLabel" hidden>上传中…</p>
          </div>
          <div class="field" style="margin-top:12px;margin-bottom:0">
            <label for="imageAlt">图片说明 imageAlt</label>
            <input class="input" id="imageAlt"/>
          </div>
        </div>
        <p class="tiny" style="margin-top:8px">路径：<span class="mono">/images/products/…</span></p>
      </aside>

      <section>
        <p class="section-title">基础信息</p>
        <div class="card">
          <div class="row-2">
            <div class="field">
              <label for="id">编号 id（只读）</label>
              <input class="input mono" id="id" readonly/>
            </div>
            <div class="field">
              <label for="category">分类 category</label>
              <select class="select" id="category">
                <option value="crystal">水晶矿石 (crystal)</option>
                <option value="wenwan">东方文玩 (wenwan)</option>
                <option value="wellness">养生香道 (wellness)</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="title">标题 title</label>
            <input class="input" id="title"/>
          </div>
          <div class="field">
            <label for="spec">规格 spec</label>
            <input class="input" id="spec"/>
            <p class="hint">可用产地占位 <span class="mono">{o1}</span> <span class="mono">{o2}</span> <span class="mono">{o3}</span> · <a href="../origins/">改产地名</a></p>
          </div>
          <div class="field">
            <label>标签 tags</label>
            <div class="tag-input" id="tags"><input type="text" placeholder="添加标签" aria-label="添加标签"/></div>
          </div>
          <div class="field">
            <label for="desc">正文 desc</label>
            <textarea class="textarea" id="desc"></textarea>
          </div>
          <div class="field" style="margin-bottom:0">
            <label for="cta">按钮文案 cta</label>
            <input class="input" id="cta"/>
          </div>
        </div>
        <div class="sticky-actions">
          <a class="btn ghost" href="./">取消</a>
          <button type="button" class="btn" id="saveBtn">保存</button>
        </div>
        <p class="tiny" style="margin-top:10px">不设价格 / 购物车 · 勿填虚构微信号</p>
      </section>
    </div>
  </main>
</div>
<div class="toast ok" id="toastOk" role="status">已保存</div>
<div class="toast err" id="toastErr" role="alert">保存失败</div>
<script src="../config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/product-edit.js"></script>
</body>
</html>
