<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>产品列表 · 星泽后台</title>
<link rel="stylesheet" href="../css/admin.css"/>
</head>
<body data-page="products-list">
<div class="shell">
  <header class="topbar">
    <a class="back" href="../">← 返回</a>
    <div class="spacer"></div>
    <span class="brand">产品</span>
  </header>
  <main class="main">
    <div id="scf-notice" class="banner-err" hidden>
      SCF 未配置 — 可预览列表；保存需 Function URL。
    </div>
    <h1 class="h1">产品</h1>
    <p class="lead" id="lead">加载中…</p>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="搜索编号或标题" aria-label="搜索产品"/>
      <button type="button" class="chip soft filter on" data-cat="all">全部</button>
      <button type="button" class="chip soft filter" data-cat="crystal">水晶</button>
      <button type="button" class="chip soft filter" data-cat="wenwan">文玩</button>
      <button type="button" class="chip soft filter" data-cat="wellness">养生</button>
      <span class="spacer"></span>
      <a class="btn sm" id="btnNew" href="edit.html?new=1">新增产品</a>
    </div>
    <div class="list" id="list"></div>
    <p class="tiny" style="margin:12px 2px">可新增 · 删除暂不可用</p>
  </main>
</div>
<script src="../config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/products-list.js"></script>
</body>
</html>
