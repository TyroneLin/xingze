<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>产地标签 · 星泽后台</title>
<link rel="stylesheet" href="../css/admin.css"/>
</head>
<body data-page="origins">
<div class="shell">
  <header class="topbar">
    <a class="back" href="../">← 返回</a>
    <div class="spacer"></div>
    <span class="brand">产地</span>
  </header>
  <main class="main narrow">
    <div id="scf-notice" class="banner-err" hidden>SCF 未配置 — 可预览；保存需 Function URL。</div>
    <h1 class="h1">产地标签</h1>
    <p class="lead"><span class="mono">products.json → origins</span> · 全局替换</p>
    <div id="errBanner" class="banner-err" hidden></div>
    <div class="note-box">产品规格 / 标签里写 <span class="mono">{o1}</span> 等占位时，前台会换成这里的文字。改一处，全站同步。</div>
    <div class="card" id="form" hidden>
      <div class="field">
        <label for="o1">o1</label>
        <input class="input" id="o1"/>
      </div>
      <div class="field">
        <label for="o2">o2</label>
        <input class="input" id="o2"/>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="o3">o3</label>
        <input class="input" id="o3"/>
      </div>
    </div>
    <div class="sticky-actions">
      <a class="btn ghost" href="../">取消</a>
      <button type="button" class="btn" id="saveBtn">保存</button>
    </div>
  </main>
</div>
<div class="toast ok" id="toastOk" role="status">已保存</div>
<div class="toast err" id="toastErr" role="alert">保存失败</div>
<script src="../config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/origins.js"></script>
</body>
</html>
