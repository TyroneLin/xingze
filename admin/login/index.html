<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>登录 · 星泽后台</title>
<link rel="stylesheet" href="../css/admin.css"/>
</head>
<body data-page="login">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">泽</div>
    <h1 class="h1">星泽后台</h1>
    <p class="lead">仅供主理人编辑 · 非正式公开页</p>
    <div id="scf-notice" class="banner-err" hidden>
      SCF 未配置 — 请在 <code>admin/config.js</code> 填写 <code>scfBase</code>（Tyrone 开通 Function URL 后）。登录暂不可用。
    </div>
    <form id="login-form">
      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required/>
      </div>
      <button class="btn block" type="submit">进入后台</button>
      <p id="login-err" class="tiny" style="color:var(--danger);min-height:1.2em;margin-top:10px" role="alert"></p>
    </form>
    <p class="foot-note">xingzestore.com/admin/ · WeChat 内置浏览器可用</p>
  </div>
</div>
<script src="../config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
