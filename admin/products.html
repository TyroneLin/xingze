<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>星泽 CMS · 产品</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="products">
  <div class="wrap">
    <div class="top">
      <a class="brand" href="products.html">星泽 CMS</a>
      <nav>
        <a class="on" href="products.html">产品</a>
        <a href="#" aria-disabled="true" title="下一迭代">好物</a>
        <a href="#" aria-disabled="true" title="下一迭代">香港代购</a>
      </nav>
      <a class="btn ghost sm" id="logout" href="index.html">退出</a>
    </div>

    <div id="scf-notice" class="notice" hidden>
      <b>SCF 未配置</b> — 请在 <code>admin/config.js</code> 将 <code>scfBase</code> 换成 Function URL（Tyrone 开通后）。保存上传暂不可用，列表仍可读本站 <code>/data/products.json</code>。
    </div>

    <h1 style="font-size:22px">产品</h1>
    <p class="muted sm">编辑后写入 COS <code>data/products.json</code>，并触发 SCF <b>rebuild bake</b>（静态 HTML）。公众站不用客户端拉 JSON。</p>

    <div class="row">
      <button type="button" class="btn ghost" id="rebuild-only">仅重建页面</button>
    </div>
    <p id="status" class="ok" role="status"></p>

    <table class="table" aria-label="产品列表">
      <thead>
        <tr><th>编号</th><th>标题</th><th>分类</th><th>图</th><th></th></tr>
      </thead>
      <tbody id="product-rows">
        <tr><td colspan="5" class="muted">加载中…</td></tr>
      </tbody>
    </table>

    <section id="edit-panel" class="card" style="max-width:560px;margin:24px 0" hidden>
      <h2 style="font-size:16px;margin-top:0">编辑产品</h2>
      <input type="hidden" id="edit-idx">
      <label>编号</label>
      <input id="edit-id" readonly>
      <label>标题</label>
      <input id="edit-title">
      <label>规格</label>
      <input id="edit-spec">
      <label>分类</label>
      <input id="edit-category" placeholder="crystal / wenwan / wellness">
      <label>简述</label>
      <textarea id="edit-desc"></textarea>
      <label>主图（下一迭代 · 现为占位）</label>
      <div class="ph">图片上传待 STS + cos 签名接通</div>
      <div class="row">
        <button type="button" class="btn" id="save-product">保存并重建</button>
      </div>
      <p class="muted sm">不设价格 / 购物车。勿填写虚构微信号。</p>
    </section>
  </div>
  <script src="config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
