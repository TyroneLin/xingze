<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>星泽 CMS · 登录</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="login">
  <div class="wrap">
    <p><a class="brand" href="/">星泽</a> <span class="muted sm">内容管理（仅 Leanne）</span></p>
    <div class="card">
      <h1 style="font-size:18px;margin:0 0 8px">登录</h1>
      <p class="muted sm">个人工作室后台 · 不设公开注册</p>
      <form id="login-form">
        <label for="password">管理密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="由 Tyrone 设置">
        <div class="row"><button class="btn" type="submit">进入</button></div>
        <p id="login-err" class="err" role="alert"></p>
      </form>
      <p class="muted sm">SCF 未开通前登录会失败，属预期。微信二维码与微信号不在此页配置。</p>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
